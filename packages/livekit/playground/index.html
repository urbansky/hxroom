<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>HxRoom Call-Schicht – Playground</title>
    <style>
      body { font: 14px/1.5 system-ui, sans-serif; margin: 0; padding: 24px; max-width: 900px; }
      h1 { font-size: 18px; margin: 0 0 4px; }
      p.lead { color: #666; margin: 0 0 20px; }
      label { display: block; margin-bottom: 8px; }
      label span { display: block; font-size: 12px; color: #666; }
      input { width: 100%; padding: 6px 8px; font: inherit; box-sizing: border-box; }
      .row { display: flex; gap: 8px; flex-wrap: wrap; margin: 16px 0; }
      button { padding: 8px 14px; font: inherit; cursor: pointer; }
      video { width: 100%; max-width: 480px; background: #111; aspect-ratio: 16/9; }
      .videos { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
      figcaption { font-size: 12px; color: #666; }
      pre { background: #f4f4f4; padding: 12px; overflow-x: auto; }
    </style>
  </head>
  <body>
    <h1>Call-Schicht – Playground</h1>
    <p class="lead">
      Prüfstand für <code>@hxroom/livekit</code> ohne App und ohne Anmeldung. Token per
      <code>lk token create … --join</code>, Gegenstelle per <code>lk room join --publish-demo</code>.
    </p>

    <label>
      <span>LiveKit-URL</span>
      <input id="url" value="ws://livekit.hxroom.localhost" />
    </label>
    <label>
      <span>Access-Token</span>
      <input id="token" placeholder="eyJhbGciOi…" />
    </label>

    <div class="row">
      <button id="prepare">Warmlauf</button>
      <button id="join">Beitreten</button>
      <button id="camera">Kamera umschalten</button>
      <button id="microphone">Mikrofon umschalten</button>
      <button id="share">Bildschirm teilen</button>
      <button id="leave">Verlassen</button>
    </div>

    <div class="videos">
      <figure style="margin: 0">
        <video id="local" autoplay playsinline muted></video>
        <figcaption>eigene Kamera</figcaption>
      </figure>
      <figure style="margin: 0">
        <video id="remote" autoplay playsinline></video>
        <figcaption>Gegenstelle</figcaption>
      </figure>
    </div>

    <pre id="state"></pre>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
