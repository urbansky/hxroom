# HxRoom – Docker Compose (Lokale Entwicklung)
# Startet Infrastruktur-Services; Apps werden per pnpm gestartet.
name: hxroom-dev

services:
  caddy:
    image: caddy:latest
    ports:
      - "80:80"
    volumes:
      - ./caddy/Caddyfile.dev:/etc/caddy/Caddyfile
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # LiveKit – WebRTC-Server (doc/technisches-konzept.md §8)
  # Signaling auf 7880 (über Caddy als livekit.hxroom.localhost erreichbar), Medien
  # direkt auf 7881/tcp und 7882/udp. Die Testschlüssel gelten nur lokal.
  livekit:
    image: livekit/livekit-server:v1.13.6
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: "hxroom_dev: hxroom_dev_livekit_secret_at_least_32_chars"
    volumes:
      - ./livekit/livekit.dev.yaml:/etc/livekit.yaml:ro
    ports:
      - "127.0.0.1:7880:7880" # Signaling (HTTP + WebSocket)
      - "127.0.0.1:7881:7881" # RTC über TCP (Fallback)
      - "127.0.0.1:7882:7882/udp" # RTC über UDP (Normalfall)
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7880/"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: hxroom
      POSTGRES_USER: hxroom
      POSTGRES_PASSWORD: hxroom
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hxroom"]
      interval: 5s
      retries: 5

  # RustFS – S3-kompatibler Object Store (siehe doc/s3-verzeichnisschema.md)
  # Setzt zuerst die Berechtigungen des Datenvolumes, da RustFS als User 10001 läuft
  rustfs-perms:
    image: alpine
    user: root
    volumes:
      - rustfs_dev_data:/data
    command: chown -R 10001:10001 /data
    restart: "no"

  rustfs:
    image: rustfs/rustfs:latest
    depends_on:
      rustfs-perms:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:9000:9000" # S3-API
      - "127.0.0.1:9001:9001" # Web-Console
    environment:
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: hxroom_dev
      RUSTFS_SECRET_KEY: hxroom_dev_secret
    volumes:
      - rustfs_dev_data:/data
    command: /data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Legt einmalig den HxRoom-Bucket an (idempotent) und setzt ihn auf privat
  rustfs-createbuckets:
    image: minio/mc:latest
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set hxroom http://rustfs:9000 hxroom_dev hxroom_dev_secret &&
      mc mb --ignore-existing hxroom/hxroom-files &&
      mc anonymous set none hxroom/hxroom-files
      "
    restart: "no"

volumes:
  postgres_dev_data:
  rustfs_dev_data:
