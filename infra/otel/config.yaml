receivers:
  hostmetrics:
    collection_interval: 15s
    root_path: /hostfs
    scrapers:
      cpu:
        metrics:
          system.cpu.utilization:
            enabled: true
      memory:
        metrics:
          system.memory.utilization:
            enabled: true
      disk:
      filesystem:
        metrics:
          system.filesystem.utilization:
            enabled: true
      load:
      network:

  docker_stats:
    endpoint: unix:///var/run/docker.sock
    collection_interval: 15s

  otlp:                          # NEU – nimmt Traces/Metrics/Logs von api an
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  resourcedetection:
    detectors: [env, system]
  batch:

  # Zweite Verteidigungslinie gegen Zugangstoken in Traces. Die API redigiert bereits an
  # der Quelle (apps/api/src/tracing-redaction.ts); hier greift dieselbe Regel noch einmal
  # für alles, was eine andere Instrumentierung oder ein künftiger Dienst beisteuert.
  # Betroffen sind die URL-Attribute beider Semconv-Generationen. `error_mode: ignore`,
  # damit ein Span ohne diese Attribute die Pipeline nicht anhält.
  transform/redact_query_tokens:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - replace_pattern(span.attributes["url.query"], "(?i)(^|[?&])(token|access_token|refresh_token|code|secret|key|password|sig|signature)=[^&]*", "$${1}$${2}=REDACTED")
          - replace_pattern(span.attributes["url.full"], "(?i)([?&])(token|access_token|refresh_token|code|secret|key|password|sig|signature)=[^&]*", "$${1}$${2}=REDACTED")
          - replace_pattern(span.attributes["http.url"], "(?i)([?&])(token|access_token|refresh_token|code|secret|key|password|sig|signature)=[^&]*", "$${1}$${2}=REDACTED")
          - replace_pattern(span.attributes["http.target"], "(?i)([?&])(token|access_token|refresh_token|code|secret|key|password|sig|signature)=[^&]*", "$${1}$${2}=REDACTED")

exporters:
  otlp/signoz:                   # umbenannt zur Unterscheidung vom otlp-*Receiver*
    endpoint: 116.203.44.109:4317
    tls:
      insecure: true

service:
  pipelines:
    metrics:
      receivers: [hostmetrics, docker_stats]
      processors: [resourcedetection, batch]
      exporters: [otlp/signoz]
    traces:                      # NEU
      receivers: [otlp]
      processors: [resourcedetection, transform/redact_query_tokens, batch]
      exporters: [otlp/signoz]

