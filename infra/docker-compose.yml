# HxRoom – Docker Compose (Produktion)
# Images werden von GitHub Actions gebaut und auf ghcr.io gepusht.
# Auf Hetzner: docker compose pull && docker compose up -d
name: hxroom

services:
  caddy:
    build: ./caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - ./caddy/data:/data
      - ./caddy/config:/config
    environment:
      - IONOS_API_TOKEN=${IONOS_API_TOKEN}
    depends_on:
      - landing
      - coach
      - bookingpage
      - admin
      - api
    restart: unless-stopped

  landing:
    image: ghcr.io/urbansky/hxroom/landing:latest
    build:
      context: ..
      dockerfile: apps/landing/Dockerfile
    restart: unless-stopped

  coach:
    image: ghcr.io/urbansky/hxroom/coach:latest
    build:
      context: ..
      dockerfile: apps/coach/Dockerfile
    restart: unless-stopped

  bookingpage:
    image: ghcr.io/urbansky/hxroom/bookingpage:latest
    build:
      context: ..
      dockerfile: apps/bookingpage/Dockerfile
    restart: unless-stopped

  admin:
    image: ghcr.io/urbansky/hxroom/admin:latest
    build:
      context: ..
      dockerfile: apps/admin/Dockerfile
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # RustFS – S3-kompatibler Object Store für Entwicklung & Pre-Launch-Server
  # (siehe doc/s3-verzeichnisschema.md). Wird zum Produktiv-Launch durch
  # Hetzner Object Storage ersetzt; nur S3_ENDPOINT/S3_REGION/S3_FORCE_PATH_STYLE
  # ändern sich dann, dieser Service entfällt.
  rustfs-perms:
    image: alpine
    user: root
    volumes:
      - rustfs_data:/data
    command: chown -R 10001:10001 /data
    restart: "no"

  rustfs:
    image: rustfs/rustfs:latest
    depends_on:
      rustfs-perms:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:9000:9000" # S3-API
      - "127.0.0.1:9001:9001" # Web-Console (per SSH-Tunnel erreichbar)
    environment:
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY}
    volumes:
      - rustfs_data:/data
    command: /data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Legt einmalig den HxRoom-Bucket an (idempotent) und setzt ihn auf privat
  rustfs-createbuckets:
    image: minio/mc:latest
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY}
    entrypoint: >
      /bin/sh -c "
      mc alias set hxroom http://rustfs:9000 $${RUSTFS_ACCESS_KEY} $${RUSTFS_SECRET_KEY} &&
      mc mb --ignore-existing hxroom/hxroom-files &&
      mc anonymous set none hxroom/hxroom-files
      "
    restart: "no"

  api:
    image: ghcr.io/urbansky/hxroom/api:latest
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      - NODE_ENV=production
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}
      - ADMIN_AUTH_URL=${ADMIN_AUTH_URL}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - COACH_APP_URL=${COACH_APP_URL}
      - ROOT_DOMAIN=${ROOT_DOMAIN}
      - ROOT_DOMAIN_HTTPS=${ROOT_DOMAIN_HTTPS}
      - BREVO_API_KEY=${BREVO_API_KEY}
      - BREVO_SENDER_EMAIL=${BREVO_SENDER_EMAIL}
      - BREVO_SENDER_NAME=${BREVO_SENDER_NAME}
      # RustFS (Dev/Pre-Launch); Wechsel auf Hetzner Object Storage zum Produktiv-Launch
      - S3_ENDPOINT=http://rustfs:9000
      - S3_REGION=us-east-1
      - S3_ACCESS_KEY=${RUSTFS_ACCESS_KEY}
      - S3_SECRET_KEY=${RUSTFS_SECRET_KEY}
      - S3_FORCE_PATH_STYLE=true
      - S3_BUCKET=hxroom-files
      # Spätere Phasen:
      # - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      # - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
    depends_on:
      postgres:
        condition: service_started
      rustfs-createbuckets:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
  rustfs_data:
