# HxRoom – Docker Compose (Produktion)
# Images werden von GitHub Actions gebaut und auf ghcr.io gepusht.
# Auf Hetzner: docker compose pull && docker compose up -d
name: hxroom

services:
  caddy:
    build: ./caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - ./caddy/data:/data
      - ./caddy/config:/config
    environment:
      - IONOS_API_TOKEN=${IONOS_API_TOKEN}
    depends_on:
      - landing
      - coach
      - bookingpage
      - admin
      - api
      - livekit
    restart: unless-stopped

  landing:
    image: ghcr.io/urbansky/hxroom/landing:latest
    build:
      context: ..
      dockerfile: apps/landing/Dockerfile
    restart: unless-stopped

  coach:
    image: ghcr.io/urbansky/hxroom/coach:latest
    build:
      context: ..
      dockerfile: apps/coach/Dockerfile
    restart: unless-stopped

  bookingpage:
    image: ghcr.io/urbansky/hxroom/bookingpage:latest
    build:
      context: ..
      dockerfile: apps/bookingpage/Dockerfile
    restart: unless-stopped

  admin:
    image: ghcr.io/urbansky/hxroom/admin:latest
    build:
      context: ..
      dockerfile: apps/admin/Dockerfile
    restart: unless-stopped

  # LiveKit – WebRTC-Server (doc/technisches-konzept.md §8)
  # Signaling auf 7880 läuft über Caddy (livekit.hxroom.de), die Medien gehen daran
  # vorbei direkt auf 7881/tcp und 7882/udp. Beide Ports brauchen eine Freigabe in der
  # Hetzner-Cloud-Firewall, sonst kommt zwar die Verbindung zustande, aber kein Bild.
  livekit:
    image: livekit/livekit-server:v1.13.6
    # Der Name des Schlüssels steht in der .env, livekit.yaml braucht ihn aber für die
    # Webhooks (B6) – und LiveKit ersetzt dort keine Umgebungsvariablen. Deshalb setzt der
    # Start ihn in eine Kopie ein. $$ lässt die Variable für die Shell im Container stehen,
    # statt sie schon beim Einlesen der Compose-Datei aufzulösen.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - sed "s/__LIVEKIT_API_KEY__/$${LIVEKIT_API_KEY}/" /etc/livekit.yaml > /tmp/livekit.yaml && exec /livekit-server --config /tmp/livekit.yaml
    environment:
      # Quotes sind Pflicht: Ohne sie liest YAML den Doppelpunkt als Mapping statt als
      # Teil des Wertes, und LiveKit startet ohne Schlüssel.
      - "LIVEKIT_KEYS=${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7881:7881"
      - "7882:7882/udp"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7880/"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ClamAV – Virenscan der im Call geteilten Dateien (doc/videocall-umsetzungsplan.md,
  # Nachtrag „Virenscan geteilter Dateien"). Die API spricht clamd auf 3310 im Docker-Netz an,
  # nach außen ist nichts offen. freshclam im Container hält die Signaturen aktuell; das
  # Volume erspart den Download (einige hundert MB) bei jedem Neustart.
  #
  # Das Debian-Image, weil es amd64 und arm64 gibt – clamav/clamav nur amd64. Beim ersten
  # Start dauert es Minuten, bis die Signaturen geladen sind; bis dahin nimmt die API Dateien
  # ungeprüft an und loggt das (entschieden 2026-09-28). Deshalb kein depends_on in der API.
  clamav:
    image: clamav/clamav-debian:1.5.4
    environment:
      # Der Standard (25M) ist genau das Dateilimit des Chats (25 MiB) – ohne Luft brächte
      # eine Datei an der Grenze clamd zum Abbruch statt zu einem Ergebnis.
      - CLAMD_CONF_StreamMaxLength=30M
    volumes:
      - clamav_data:/var/lib/clamav
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    image: ghcr.io/urbansky/hxroom/api:latest
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      - NODE_ENV=production
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}
      - ADMIN_AUTH_URL=${ADMIN_AUTH_URL}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - COACH_APP_URL=${COACH_APP_URL}
      - ROOT_DOMAIN=${ROOT_DOMAIN}
      - ROOT_DOMAIN_HTTPS=${ROOT_DOMAIN_HTTPS}
      - BREVO_API_KEY=${BREVO_API_KEY}
      - BREVO_SENDER_EMAIL=${BREVO_SENDER_EMAIL}
      - BREVO_SENDER_NAME=${BREVO_SENDER_NAME}
      # Hetzner Object Storage (extern, S3-kompatibel). Anders als in der
      # Entwicklung (docker-compose.dev.yml, RustFS) läuft hier kein eigener
      # Object-Store-Container; Endpunkt, Region und Schlüssel kommen aus der .env.
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_REGION=${S3_REGION}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_FORCE_PATH_STYLE=${S3_FORCE_PATH_STYLE}
      - S3_BUCKET=${S3_BUCKET}
      # LiveKit: zwei URLs, die nicht verwechselt werden dürfen. LIVEKIT_URL geht an den
      # Browser (mit dem Access-Token), LIVEKIT_HOST ist der interne Weg für
      # Server-zu-Server-Aufrufe (RoomService, Webhooks).
      - LIVEKIT_URL=${LIVEKIT_URL}
      - LIVEKIT_HOST=http://livekit:7880
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      # Fest eingetragen, nicht aus der .env: Ein vergessener Eintrag schaltete den
      # Virenscan still ab.
      - CLAMAV_HOST=clamav
      - CLAMAV_PORT=3310
      # Fehlerüberwachung (GlitchTip, errors.hxcode.io): DSN des API-Projekts und die DSNs der
      # Frontends, die der Tunnel POST /api/v1/monitoring weiterreichen darf
      - SENTRY_DSN=${SENTRY_DSN}
      - SENTRY_ENVIRONMENT=production
      - SENTRY_TUNNEL_DSNS=${SENTRY_TUNNEL_DSNS}
    depends_on:
      postgres:
        condition: service_started
    restart: unless-stopped

  # Nächtliches Backup: pg_dump nach 03:00, Dateien nach 03:30, beides in den Backup-Bucket im
  # eigenen Hetzner-Projekt (Nürnberg). Gebaut auf dem Server wie Caddy, nicht in der CI.
  # Ablauf und Wiederherstellung: doc/technisches-konzept.md §13.
  backup:
    build: ./backup
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      # Quelle: derselbe Datei-Bucket wie für die API
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_REGION=${S3_REGION}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_FORCE_PATH_STYLE=${S3_FORCE_PATH_STYLE}
      - S3_BUCKET=${S3_BUCKET}
      # Ziel: Backup-Bucket
      - BACKUP_S3_ENDPOINT=${BACKUP_S3_ENDPOINT}
      - BACKUP_S3_REGION=${BACKUP_S3_REGION}
      - BACKUP_S3_ACCESS_KEY=${BACKUP_S3_ACCESS_KEY}
      - BACKUP_S3_SECRET_KEY=${BACKUP_S3_SECRET_KEY}
      - BACKUP_S3_FORCE_PATH_STYLE=${BACKUP_S3_FORCE_PATH_STYLE}
      - BACKUP_S3_BUCKET=${BACKUP_S3_BUCKET}
      - BACKUP_AGE_RECIPIENTS=${BACKUP_AGE_RECIPIENTS}
      # Meldungen: Checkly bei Erfolg, Mail über Brevo bei Fehler
      - CHECKLY_HEARTBEAT_DB=${CHECKLY_HEARTBEAT_DB}
      - CHECKLY_HEARTBEAT_FILES=${CHECKLY_HEARTBEAT_FILES}
      - BACKUP_ALERT_EMAIL=${BACKUP_ALERT_EMAIL}
      - BREVO_API_KEY=${BREVO_API_KEY}
      - BREVO_SENDER_EMAIL=${BREVO_SENDER_EMAIL}
      - BREVO_SENDER_NAME=${BREVO_SENDER_NAME}
      - BACKUP_LABEL=Produktion
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
  clamav_data:
