# Speicherdauer des Systemjournals auf dem HxRoom-Server. Die Container schreiben ihre Logs
# dorthin (logging-Treiber journald in docker-compose.yml); die Datenschutzerklärung sagt
# „Server-Logs max. 14 Tage“.
#
# Einrichten, einmal auf dem Server:
#   sudo mkdir -p /etc/systemd/journald.conf.d
#   sudo cp infra/journald/hxroom.conf /etc/systemd/journald.conf.d/hxroom.conf
#   sudo systemctl restart systemd-journald
# Prüfen:
#   systemd-analyze cat-config systemd/journald.conf | grep MaxRetentionSec
#   journalctl --disk-usage
#
# Gilt für das ganze Journal, also auch für Systemmeldungen des Servers.

[Journal]
MaxRetentionSec=14day
# Obergrenze für den Platz, falls bei viel Verkehr 14 Tage mehr wären als sinnvoll.
SystemMaxUse=1G
