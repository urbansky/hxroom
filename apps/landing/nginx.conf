server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
    # Pflicht hinter Caddy: nginx komprimiert sonst nichts, was mit einem Via-Header kommt
    # (gzip_proxied off) – und Caddy schickt ihn immer. Das gilt auch für gzip_static unten.
    # Bis 2026-09-28 kam deshalb alles unkomprimiert an.
    gzip_proxied any;
    gzip_vary on;

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    location /_nuxt/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
        gzip_static on;
    }
}
