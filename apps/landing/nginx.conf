server {
    listen 80;
    server_name _;
    # Keine nginx-Version im Server-Header und auf Fehlerseiten.
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_types text/plain text/markdown text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
    # Pflicht hinter Caddy: nginx komprimiert sonst nichts, was mit einem Via-Header kommt
    # (gzip_proxied off) – und Caddy schickt ihn immer. Das gilt auch für gzip_static unten.
    # Bis 2026-09-28 kam deshalb alles unkomprimiert an.
    gzip_proxied any;
    gzip_vary on;

    # Umleitungen relativ: nginx kennt hinter Caddy weder https noch den echten Host und
    # leitete sonst auf http://hxroom.de/… um.
    absolute_redirect off;

    # /handbuch/videocall direkt aus /handbuch/videocall/index.html, ohne 301 auf den
    # Schrägstrich: Canonical, Sitemap und Links nennen die Adresse ohne.
    location / {
        try_files $uri $uri/index.html $uri/ =404;
    }

    # Markdown-Fassung der Handbuchseiten für KI-Agenten. mime.types kennt .md nicht und
    # schickte sie als application/octet-stream – der Browser lüde sie herunter.
    location ~ ^/handbuch/.+\.md$ {
        types { }
        default_type "text/markdown; charset=utf-8";
        try_files $uri =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    location /_nuxt/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
        gzip_static on;
    }
}
