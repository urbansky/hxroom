# Zugriffslog ohne Query-String und ohne Referer. Die Links, mit denen ein Coach hier
# ankommt, tragen ihr Geheimnis in der URL (/auth/reset-password?token=…); das
# nginx-Standardformat "combined" schriebe es mit $request und $http_referer im Klartext
# in die Container-Logs.
# $request_path behält den vollen Pfad, damit die Diagnose nicht verloren geht.
map $request_uri $request_path {
    ~^(?<path_without_query>[^?]*) $path_without_query;
}

log_format hxroom '$remote_addr - $remote_user [$time_local] '
                  '"$request_method $request_path $server_protocol" $status $body_bytes_sent '
                  '"-" "$http_user_agent"';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log hxroom;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /_nuxt/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
