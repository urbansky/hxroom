<html lang="de">
<head>

<style>

  }
  .circle {
    width: 300px; height: 300px; border-radius: 50%;
    background: linear-gradient(135deg, #8B9E8A, #5C6E5B);
    display: flex; align-items: center; justify-content: center;
  }
  svg { width: 150px; height: 150px; }
</style>
</head>
<body>
  <div class="tile">
    <div class="circle">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" opacity="0.92" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5" />
        <rect x="2" y="6" width="14" height="12" rx="2" />

    </div>
  </div>

</html>
