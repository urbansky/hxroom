<!DOCTYPE html>
<!-- Quelle für apps/landing/public/og-image.jpg (1200 × 630, Faktor 1): Vorschaubild, wenn die
     Landing-Page in Slack, LinkedIn, WhatsApp & Co. geteilt wird. Gleicher Stil wie
     media/linkedin/banner.html; rechts das erste Bild des Hero-Loops im Browserrahmen.
     Viele Dienste beschneiden die Ränder leicht, deshalb hält der Text Abstand. -->
<html lang="de">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: 'Cormorant Garamond'; font-style: normal; font-weight: 300 600;
    src: url('../../packages/ui/theme/fonts/cormorant-garamond-latin-normal.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Cormorant Garamond'; font-style: italic; font-weight: 300 400;
    src: url('../../packages/ui/theme/fonts/cormorant-garamond-latin-italic.woff2') format('woff2');
  }
  @font-face {
    font-family: 'DM Sans'; font-style: normal; font-weight: 300 500;
    src: url('../../packages/ui/theme/fonts/dm-sans-latin.woff2') format('woff2');
  }
  html, body { margin: 0; }
  .card {
    position: relative; overflow: hidden;
    width: 1200px; height: 630px;
    background: #F5F0E8;
    font-family: 'DM Sans', sans-serif;
  }
  .glow {
    position: absolute; inset: 0;
    background:
      radial-gradient(circle at 88% -10%, rgba(181, 147, 90, 0.18), transparent 45%),
      radial-gradient(circle at 0% 110%, rgba(139, 158, 138, 0.14), transparent 40%);
  }
  .waves { position: absolute; left: 0; top: 630px; width: 0; height: 0; }
  .waves i {
    position: absolute; border-radius: 50%; transform: translate(-50%, -50%);
    width: var(--d); height: var(--d);
    border: 1px solid rgba(139, 158, 138, var(--o));
  }
  .content {
    position: absolute; left: 72px; top: 0; bottom: 0; width: 470px;
    display: flex; flex-direction: column; justify-content: center;
  }
  .eyebrow {
    font-size: 15px; letter-spacing: 0.16em; text-transform: uppercase;
    color: #634d2c; margin-bottom: 22px;
  }
  h1 {
    margin: 0; font-family: 'Cormorant Garamond', serif; font-weight: 400;
    font-size: 58px; line-height: 1.04; letter-spacing: -0.015em; color: #2e3a2d;
  }
  h1 em { font-style: italic; color: #5C6E5B; white-space: nowrap; }
  .facts {
    margin-top: 28px; font-size: 19px; line-height: 1.6; color: #4a5a49;
  }
  .facts span { margin: 0 9px; color: #B5935A; }
  .domain {
    margin-top: 30px; font-size: 18px; font-weight: 500; letter-spacing: 0.02em; color: #2e3a2d;
  }
  /* Produktbild: läuft rechts aus dem Bild, damit es groß genug lesbar bleibt. */
  .frame {
    position: absolute; left: 590px; top: 92px; width: 740px;
    border-radius: 14px; overflow: hidden;
    border: 1px solid rgba(46, 58, 45, 0.12);
    background: #fff;
    box-shadow: 0 30px 70px -30px rgba(46, 58, 45, 0.45);
  }
  .bar {
    height: 30px; display: flex; align-items: center; gap: 7px; padding: 0 14px;
    background: #EFE9DE; border-bottom: 1px solid rgba(46, 58, 45, 0.1);
  }
  .bar i { width: 10px; height: 10px; border-radius: 50%; background: #DCD4C6; }
  .frame img { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
  <div class="card">
    <div class="glow"></div>
    <div class="waves">
      <i style="--d: 360px; --o: 0.40"></i>
      <i style="--d: 520px; --o: 0.30"></i>
      <i style="--d: 680px; --o: 0.20"></i>
      <i style="--d: 840px; --o: 0.12"></i>
    </div>
    <div class="content">
      <div class="eyebrow">Videoplattform für Coaches</div>
      <h1>Terminbuchung und Videocall – <em>in einem.</em></h1>
      <div class="facts">Klienten ohne Konto<span>·</span>Server in Deutschland</div>
      <div class="domain">hxroom.de</div>
    </div>
    <div class="frame">
      <div class="bar"><i></i><i></i><i></i></div>
      <img src="../../apps/landing/public/video/hxroom-buchung-bis-videocall-poster.webp" alt="">
    </div>
  </div>
</body>
</html>
